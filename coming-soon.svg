<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4d5e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)" rx="8"/>
  <!-- Decorative lines -->
  <line x1="0" y1="50" x2="400" y2="50" stroke="#dc1a2e" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#dc1a2e" stroke-width="1" opacity="0.2"/>
  <!-- Gear icon suggestion (circles) -->
  <circle cx="200" cy="70" r="22" fill="none" stroke="#dc1a2e" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="70" r="10" fill="none" stroke="#dc1a2e" stroke-width="2" opacity="0.5"/>
  <!-- Wrench symbol lines -->
  <line x1="188" y1="58" x2="192" y2="62" stroke="#dc1a2e" stroke-width="2" opacity="0.5"/>
  <line x1="208" y1="78" x2="212" y2="82" stroke="#dc1a2e" stroke-width="2" opacity="0.5"/>
  <!-- COMING SOON text -->
  <text x="200" y="120" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="3">COMING SOON</text>
  <!-- Tagline -->
  <text x="200" y="148" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle" letter-spacing="2">STAY TUNED</text>
</svg>
