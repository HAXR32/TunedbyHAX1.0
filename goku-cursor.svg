<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48">
  <!-- Body / gi top - orange -->
  <rect x="10" y="22" width="12" height="14" rx="2" fill="#FF6B00"/>
  <!-- Belt - blue -->
  <rect x="9" y="33" width="14" height="3" rx="1" fill="#1A4DB5"/>
  <!-- Left arm pointing outward (pointer direction) -->
  <rect x="2" y="23" width="8" height="4" rx="2" fill="#FF6B00"/>
  <!-- Right arm -->
  <rect x="22" y="23" width="7" height="4" rx="2" fill="#FF6B00"/>
  <!-- Pointing finger (hotspot at tip ~2,25) -->
  <rect x="0" y="24" width="4" height="2.5" rx="1.2" fill="#F4C08A"/>
  <!-- Pants - blue -->
  <rect x="10" y="36" width="5" height="8" rx="1" fill="#1A4DB5"/>
  <rect x="17" y="36" width="5" height="8" rx="1" fill="#1A4DB5"/>
  <!-- Boots - dark -->
  <rect x="10" y="42" width="5" height="4" rx="1" fill="#222"/>
  <rect x="17" y="42" width="5" height="4" rx="1" fill="#222"/>
  <!-- Head -->
  <ellipse cx="16" cy="16" rx="7" ry="7.5" fill="#F4C08A"/>
  <!-- Hair (iconic spiky black hair) -->
  <!-- Main hair base -->
  <ellipse cx="16" cy="10" rx="7" ry="5" fill="#1A1A1A"/>
  <!-- Spikes -->
  <polygon points="9,11 7,4 12,10" fill="#1A1A1A"/>
  <polygon points="11,8 10,1 15,8" fill="#1A1A1A"/>
  <polygon points="16,7 16,0 20,7" fill="#1A1A1A"/>
  <polygon points="21,8 23,1 22,8" fill="#1A1A1A"/>
  <polygon points="23,11 26,4 22,10" fill="#1A1A1A"/>
  <!-- Eyes -->
  <ellipse cx="13" cy="16" rx="1.5" ry="1.5" fill="#1A1A1A"/>
  <ellipse cx="19" cy="16" rx="1.5" ry="1.5" fill="#1A1A1A"/>
  <!-- Eye whites -->
  <ellipse cx="13.5" cy="15.7" rx="0.5" ry="0.5" fill="white"/>
  <ellipse cx="19.5" cy="15.7" rx="0.5" ry="0.5" fill="white"/>
  <!-- Eyebrows -->
  <rect x="11" y="13.5" width="4" height="1.2" rx="0.6" fill="#1A1A1A" transform="rotate(-8,13,14)"/>
  <rect x="17" y="13.5" width="4" height="1.2" rx="0.6" fill="#1A1A1A" transform="rotate(8,19,14)"/>
  <!-- Nose -->
  <ellipse cx="16" cy="18" rx="0.8" ry="0.5" fill="#C9956A"/>
  <!-- Mouth - determined expression -->
  <path d="M13.5 20 Q16 21.5 18.5 20" stroke="#8B5C3A" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Ear -->
  <ellipse cx="9" cy="17" rx="1.5" ry="2" fill="#F4C08A"/>
  <ellipse cx="23" cy="17" rx="1.5" ry="2" fill="#F4C08A"/>
  <!-- Ki aura glow hint (subtle yellow outline) -->
  <ellipse cx="16" cy="24" rx="13" ry="22" fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.35"/>
</svg>
